name: CodeQL

on:
  push:
    branches: [master]
    paths:
      - 'compose.yml'
      - 'Dockerfile'
      - 'examples/**'
      - 'guard_agent/**'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'tests/**'
  pull_request:
    branches: [master]
    paths:
      - 'compose.yml'
      - 'Dockerfile'
      - 'examples/**'
      - 'guard_agent/**'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'tests/**'
  schedule:
    - cron: '0 0 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      matrix:
        language: [python]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.38.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.2

