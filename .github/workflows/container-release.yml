name: Publish Containerized Demo

on:
  release:
    types: [created]
  push:
    branches:
      - master
    paths:
      - 'examples/**'
      - 'guard_agent/**'
      - 'pyproject.toml'
      - '.github/workflows/container-release.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-container:
    name: publish-container
    runs-on: ubuntu-latest
    permissions:
      packages: write # push the image to GHCR
      contents: read # check out the repository

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set version tag
        id: set_version
        run: |
          if [[ "${EVENT_NAME}" == "release" ]]; then
            echo "VERSION=${GITHUB_EVENT_RELEASE_TAG_NAME}" >> "$GITHUB_ENV"
            echo "IS_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "VERSION=latest" >> "$GITHUB_ENV"
            echo "IS_RELEASE=false" >> "$GITHUB_ENV"
          fi
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -f examples/demo_app/Dockerfile -t guard-agent-demo .

      - name: Check out the CVE scan tools (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Guard-Core/.github
          ref: b77067336bbd96d7b8244ca425de197bdcf0001c
          path: .cve-scan-tools
          persist-credentials: false

      - name: Scan the image before the push (any advisory with a fixed version fails)
        run: |
          IMAGE=guard-agent-demo
          .cve-scan-tools/cve-scan/install_scanners.sh "$RUNNER_TEMP/scanner-bin"
          python3 -I .cve-scan-tools/cve-scan/cve_scan.py --images-only --image-ref "demo=$IMAGE" --root . --osv "$RUNNER_TEMP/scanner-bin/osv-scanner" --trivy "$RUNNER_TEMP/scanner-bin/trivy" --out "$RUNNER_TEMP/image-scan-out"

      - name: Tag and Push to GHCR
        run: |
          docker tag guard-agent-demo ghcr.io/guard-core/guard-agent:latest
          docker push ghcr.io/guard-core/guard-agent:latest

          if [[ "${IS_RELEASE}" == "true" ]]; then
            docker tag guard-agent-demo "ghcr.io/guard-core/guard-agent:${VERSION}"
            docker push "ghcr.io/guard-core/guard-agent:${VERSION}"
          fi
