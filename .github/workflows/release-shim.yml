name: Publish legacy shim to PyPI

# One-shot workflow to publish the `fastapi-guard-agent` meta-package (shim)
# that transitively installs `guard-agent`. Triggered manually after the
# main `guard-agent` release has been published and verified.
#
# NOTE: Re-running this workflow will fail unless the shim version in
# `shim/pyproject.toml` is bumped (PyPI rejects re-uploading the same version).

on:
  workflow_dispatch:

jobs:
  publish-shim:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build shim package
        working-directory: shim
        run: |
          python -m build

      - name: Publish shim to PyPI
        # Uses TWINE_PASSWORD_LEGACY — a token scoped to the legacy
        # `fastapi-guard-agent` PyPI project. The main `TWINE_PASSWORD`
        # secret is scoped to `guard-agent` post-rotation and cannot
        # upload to the legacy project.
        working-directory: shim
        env:
          TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD_LEGACY }}
        run: |
          twine upload dist/*

