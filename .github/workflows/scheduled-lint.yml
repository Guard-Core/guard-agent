name: Scheduled Lint Check

on:
  schedule:
    # NOTE: Mondays @ 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduled-pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Tooling job with no test run: pre-commit and the lock tools need Python 3.11 (filelock 4.2.1, D-164), and mypy keeps python_version 3.10 in pyproject.toml; the test matrix owns the other versions.
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run pre-commit checks
        id: precommit
        run: |
          EXIT_CODE=0
          uv run --extra dev pre-commit run --all-files > precommit_output.txt 2>&1 || EXIT_CODE=$?

          OUTPUT=$(cat precommit_output.txt)
          echo "$OUTPUT"
          {
            echo "output<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Tooling job with no test run: pre-commit and the lock tools need Python 3.11 (filelock 4.2.1, D-164), and mypy keeps python_version 3.10 in pyproject.toml; the test matrix owns the other versions.
          python-version: '3.11'

      - name: Install the locked docs tools
        run: |
          pip install uv
          uv sync --locked --group docs

      - name: Run markdown checks
        id: markdown
        run: |
          EXIT_CODE=0
          uv run --no-sync pymarkdownlnt scan docs README.md CHANGELOG.md > markdown_output.txt 2>&1 || EXIT_CODE=$?

          OUTPUT=$(cat markdown_output.txt)
          echo "$OUTPUT"
          {
            echo "output<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

