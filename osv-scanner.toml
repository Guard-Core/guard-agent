# Per-advisory suppressions read by the CVE gate (.github/workflows/cve-scan.yml, Guard-Core/.github cve-scan/cve_scan.py).
# Every entry names one advisory, states why it does not reach users and carries an ignoreUntil date. An expired entry fails the gate,
# an entry that matches nothing fails the gate, and an OSV MAL-* entry can never be listed. Delete the entry when the blocker is gone.

[[IgnoredVulns]]
id = "CVE-2026-59951"
ignoreUntil = 2026-12-15
reason = "mcp 1.29.0 is in the lock only through semgrep (dependents chain from uv.lock: mcp <- semgrep <- guard-agent[dev]), the dev-only static analyzer; it is in no runtime dependency, no shipped extra and not in the wheel. The fixed mcp 1.30.0 cannot be locked because semgrep 1.181.0 pins the 1.x line it was built against (an upgrade of mcp alone downgrades unrelated dev packages). Remove when a semgrep release accepts mcp >= 1.30.0."

