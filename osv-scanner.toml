[[IgnoredVulns]]
id = "CVE-2026-116577"
ignoreUntil = 2026-12-15
reason = "tornado 6.5.10 (a dev dependency of the examples and tests) is the Python 3.10 fork of the lock: the fixed tornado 6.6 requires Python >= 3.11 and guard-agent declares >= 3.10, so no fixed release exists for 3.10 (the lock resolves 6.6 on 3.11 and later). Decide at the next release whether 3.10 stays supported; remove when it is dropped."

